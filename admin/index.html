<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Peepless Admin</title><link rel="icon" href="../icon.png">
<style>
:root{--bg:#04060a;--card:#0a1628;--line:#15284a;--text:#f4f7fa;--muted:#8c9db5;--accent:#1de9d6;--ok:#2ecc71;--warn:#ffb547;--bad:#ff5a6a}
@media (prefers-color-scheme:light){:root{--bg:#f4f7fa;--card:#fff;--line:#dde5ef;--text:#0a1628;--muted:#52627a;--accent:#00897b;--ok:#1e9e57;--warn:#a15c00;--bad:#c62839}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 48px}
.lock{min-height:100vh;display:grid;place-items:center;padding:16px}
.lock form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:min(360px,100%);text-align:center}
.lock img{width:64px;height:64px;border-radius:16px}
input[type=password],input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
button{background:var(--accent);color:#04201d;border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.err{color:var(--bad);min-height:1.5em;margin:8px 0 0}
label.rem{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:13px;margin:12px 0}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
header img{width:40px;height:40px;border-radius:10px}header h1{font-size:22px;margin:0;margin-right:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.card h2{font-size:16px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.wide{grid-column:1/-1}
.kpis{display:flex;gap:24px;flex-wrap:wrap}.kpi b{display:block;font-size:26px}.kpi span{color:var(--muted);font-size:13px}
.stars{color:var(--warn);letter-spacing:1px}
.review{border-top:1px solid var(--line);padding:12px 0}.review:first-child{border-top:0}
.review .meta{color:var(--muted);font-size:13px}.review p{margin:4px 0 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.ok{color:var(--ok)}.bad{color:var(--bad)}.muted{color:var(--muted)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text)}.links a:hover{border-color:var(--accent);text-decoration:none}
.task{display:flex;gap:10px;align-items:flex-start;padding:6px 0}.task input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.task.done span{color:var(--muted);text-decoration:line-through}.task .x{margin-left:auto;background:none;color:var(--muted);padding:0 4px;font-weight:400}
.add{display:flex;gap:8px;margin-top:10px}
@media (max-width:760px){.grid{grid-template-columns:1fr}.links{grid-template-columns:1fr}}
</style></head><body>
<div class="lock" id="lock"><form id="f"><img src="../icon.png" alt=""><h1 style="font-size:20px">Peepless Admin</h1>
<input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" autofocus>
<label class="rem"><input type="checkbox" id="rem"> Auf diesem Gerät angemeldet bleiben</label>
<button style="width:100%">Entsperren</button><p class="err" id="err"></p></form></div>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, 256));
}
async function open(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct));
  const panel = JSON.parse(new TextDecoder().decode(plain));
  document.getElementById("lock").remove();
  document.body.insertAdjacentHTML("beforeend", panel.html);
  const s = document.createElement("script"); s.textContent = panel.js; document.body.appendChild(s);
}
const enc = (u) => btoa(String.fromCharCode(...u));
(async () => {
  let saved = null;
  try { saved = localStorage.getItem("peepless-admin-key") || sessionStorage.getItem("peepless-admin-key"); } catch (_) {}
  if (saved) { try { await open(b64(saved)); return; } catch (_) { try { localStorage.removeItem("peepless-admin-key"); } catch (_) {} } }
})();
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err"); err.textContent = "Prüfe …";
  try {
    const remember = document.getElementById("rem").checked;
    const raw = await keyFrom(document.getElementById("pw").value);
    await open(raw);
    try { (remember ? localStorage : sessionStorage).setItem("peepless-admin-key", enc(raw)); } catch (_) {}
  } catch (_) { err.textContent = "Falsches Passwort."; }
});
